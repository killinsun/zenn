version: 1

rules:
  # 技術用語の統一
  - expected: JavaScript
    patterns:
      - Javascript
      - javascript
      - java script
      - Java Script

  - expected: Node.js
    patterns:
      - NodeJS
      - nodejs
      - node.js

  - expected: npm
    patterns:
      - NPM

  - expected: GitHub
    patterns:
      - Github
      - github

  - expected: macOS
    patterns:
      - Mac OS
      - MacOS
      - Mac

  - expected: iOS
    patterns:
      - IOS

  - expected: TypeScript
    patterns:
      - Typescript
      - typescript
      - type script

  - expected: リポジトリ
    patterns:
      - レポジトリ

  - expected: エディタ
    patterns:
      - エディター

  # 長音つきが正の語は、末尾に「ー」が続かない場合だけ検出する。
  # 単に `- ユーザ` と書くと「ユーザー」の中の「ユーザ」にも当たり、
  # --fix で「ユーザーー」になってしまう。
  - expected: ユーザー
    patterns:
      - /ユーザ(?!ー)/

  - expected: サーバー
    patterns:
      - /サーバ(?!ー)/

  - expected: ブラウザー
    patterns:
      - /ブラウザ(?!ー)/

  - expected: コンピューター
    patterns:
      - /コンピュータ(?!ー)/

  # より良い表現
  - expected: 例えば
    patterns:
      - たとえば

  - expected: さまざま
    patterns:
      - 様々

  - expected: すべて
    patterns:
      - 全て

  - expected: できる
    patterns:
      - 出来る

  - expected: すでに
    patterns:
      - 既に

  - expected: もっとも
    patterns:
      - 最も 